<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aisle Chaos: Dungeon Run</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ===================== HECKLER PAGE ===================== */
  #heckler-page {
    display: none;
    min-height: 100vh;
    background: #0a0f0a;
    font-family: 'Courier New', monospace;
    color: #fff;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }
  #heckler-page.active { display: flex; }

  .heckler-title {
    font-size: 22px;
    font-weight: bold;
    color: #ff7a00;
    letter-spacing: 2px;
    margin-bottom: 4px;
    text-align: center;
  }
  .heckler-subtitle {
    font-size: 11px;
    color: #ffe066;
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-align: center;
  }
  .heckler-status {
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 20px;
    margin-bottom: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .heckler-status.connecting { background: #1a1a1a; color: #888; border: 1px solid #333; }
  .heckler-status.connected  { background: #14532d; color: #4ade80; border: 1px solid #16a34a; }
  .heckler-status.disconnected { background: #450a0a; color: #f87171; border: 1px solid #ef4444; }

  .heckler-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    width: 100%;
    max-width: 360px;
  }
  .heckler-name-row label {
    font-size: 11px;
    color: #aaa;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .heckler-name-row input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
  }
  .heckler-name-row input:focus { border-color: #ff7a00; }

  .heckler-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  .heckler-btn {
    border: none;
    border-radius: 16px;
    padding: 22px 10px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    position: relative;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .heckler-btn:active { transform: scale(0.95); }
  .heckler-btn.on-cooldown { opacity: 0.4; cursor: not-allowed; }
  .heckler-btn .btn-emoji { font-size: 36px; line-height: 1; }
  .heckler-btn .btn-label { font-size: 11px; letter-spacing: 1px; }
  .heckler-btn .cooldown-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 4px;
    border-radius: 0 0 16px 16px;
    background: rgba(255,255,255,0.5);
    width: 0%;
    transition: width 0.1s linear;
  }

  .btn-wet   { background: #d97706; color: #fff; }
  .btn-cart  { background: #4b5563; color: #fff; }
  .btn-kevin { background: #ea580c; color: #fff; }
  .btn-restock { background: #16a34a; color: #fff; }

  .heckler-log {
    margin-top: 22px;
    width: 100%;
    max-width: 360px;
    font-size: 11px;
    color: #666;
    text-align: center;
    min-height: 40px;
  }
  .heckler-log .log-entry {
    color: #ffe066;
    margin-bottom: 4px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* ===================== GAME PAGE ===================== */
  #game-page { display: none; }
  #game-page.active { display: block; }

  body {
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    max-width: 540px;
    max-height: 540px;
    margin: 0 auto;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #dpad {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: 44px 44px 44px;
    grid-template-rows: 44px 44px 44px;
    gap: 4px;
    z-index: 100;
  }
  #dpad button {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #dpad button:active { background: rgba(255,255,255,0.35); }
  #dpad .empty { visibility: hidden; }
  #throw-btn {
    position: fixed;
    bottom: 40px;
    right: 24px;
    width: 70px;
    height: 70px;
    background: rgba(255, 122, 0, 0.85);
    border: 3px solid #ff7a00;
    border-radius: 50%;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    z-index: 100;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    letter-spacing: 0.5px;
  }
  #throw-btn:active { background: rgba(255,160,0,0.95); }
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    z-index: 100;
  }
  #hud span { color: #ff7a00; font-weight: bold; }
  #room-code-hud {
    position: fixed;
    top: 32px;
    left: 6px;
    font-size: 9px;
    font-family: 'Courier New', monospace;
    color: rgba(255,255,255,0.45);
    z-index: 100;
    letter-spacing: 1px;
    pointer-events: none;
  }
  #hecklers-count {
    position: fixed;
    top: 32px;
    right: 6px;
    font-size: 9px;
    font-family: 'Courier New', monospace;
    color: rgba(255,220,100,0.6);
    z-index: 100;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- HECKLER JOIN PAGE — shown when ?join=CODE is in URL         -->
<!-- ============================================================ -->
<div id="heckler-page">
  <div class="heckler-title">🛒 HECKLE THE RUNNER</div>
  <div class="heckler-subtitle">KUSH CHAOS DUNGEON — THROW CHAOS</div>

  <div id="heckler-status" class="heckler-status connecting">⏳ CONNECTING...</div>

  <div class="heckler-name-row">
    <label>YOUR NAME:</label>

  <div class="heckler-buttons">
    <button class="heckler-btn btn-wet"    data-type="wet_floor" onclick="sendHeckle(this)">

<!-- ============================================================ -->
<!-- GAME PAGE                                                    -->
<!-- ============================================================ -->
<div id="game-page">
  <div id="hud">
    <div>❤️ <span id="hp-display">3</span></div>
    <div style="color:#ffe066;font-weight:bold;letter-spacing:1px;">AISLE CHAOS</div>

  <!-- D-pad -->

<script>
// ============================================================
// PAGE ROUTING — heckler vs game
// ============================================================
const urlParams = new URLSearchParams(window.location.search);
const joinCode = urlParams.get('join');

if (joinCode) {
  // Show heckler page
  document.getElementById('heckler-page').classList.add('active');
  initHecklerPage(joinCode.toUpperCase());
} else {
  // Show game page
  document.getElementById('game-page').classList.add('active');
  initGamePage();
}

// ============================================================
// HECKLER PAGE LOGIC
// ============================================================
function initHecklerPage(code) {
  document.title = 'Heckle the Runner — Kush Chaos';
  const COOLDOWN_MS = 8000;
  const cooldowns = {};
  const cooldownIntervals = {};
  let hostConn = null;
  let hecklerPeer = null;

  const statusEl = document.getElementById('heckler-status');
  const logEl = document.getElementById('heckler-log');

  function setStatus(state, text) {
    statusEl.className = 'heckler-status ' + state;
    statusEl.textContent = text;
  }

  function addLog(text) {
    const el = document.createElement('div');
    el.className = 'log-entry';
    el.textContent = text;
    logEl.innerHTML = '';
    logEl.appendChild(el);
  }

  function connectToHost() {
    setStatus('connecting', '⏳ CONNECTING...');
    hecklerPeer = new Peer(undefined, { debug: 1 });

    hecklerPeer.on('open', () => {
      hostConn = hecklerPeer.connect('kc-dungeon-' + code, { reliable: true });

      hostConn.on('open', () => {
        setStatus('connected', '✓ CONNECTED — HECKLE AWAY!');
        addLog('Ready to throw chaos at the runner!');
      });

      hostConn.on('close', () => {
        setStatus('disconnected', '✗ DISCONNECTED');
        addLog('Lost connection to the game.');
        // Retry after 3s
        setTimeout(connectToHost, 3000);
      });

      hostConn.on('error', () => {
        setStatus('disconnected', '✗ ERROR — RETRYING...');
        setTimeout(connectToHost, 3000);
      });
    });

    hecklerPeer.on('error', () => {
      setStatus('disconnected', '✗ PEER ERROR — RETRYING...');
      try { hecklerPeer.destroy(); } catch(e) {}
      setTimeout(connectToHost, 3000);
    });
  }

  connectToHost();

  window.sendHeckle = function(btn) {
    const type = btn.getAttribute('data-type');
    if (cooldowns[type]) return;
    if (!hostConn || !hostConn.open) {
      addLog('Not connected yet!');
      return;
    }

    const name = document.getElementById('heckler-name').value.trim() || 'Heckler';
    hostConn.send(JSON.stringify({ type, name }));

    const labels = {
      wet_floor: '⚠️ Wet Floor thrown!',
      cart: '🛒 Shopping Cart launched!',
      mini_kevin: '👺 Mini Kevin unleashed!',
      restock: '📦 Restocked the store!'
    };
    addLog(labels[type] || 'Obstacle thrown!');

    // Start cooldown
    cooldowns[type] = true;
    btn.classList.add('on-cooldown');
    const bar = document.getElementById('cd-' + type);
    const startTime = Date.now();

    if (cooldownIntervals[type]) clearInterval(cooldownIntervals[type]);
    cooldownIntervals[type] = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const pct = Math.min(100, (elapsed / COOLDOWN_MS) * 100);
      bar.style.width = pct + '%';
      if (elapsed >= COOLDOWN_MS) {
        clearInterval(cooldownIntervals[type]);
        cooldowns[type] = false;
        btn.classList.remove('on-cooldown');
        bar.style.width = '0%';
      }
    }, 80);
  };
}

// ============================================================
// GAME PAGE LOGIC
// ============================================================
function initGamePage() {

// ============================================================
// AISLE CHAOS: DUNGEON RUN
// Top-down 8-bit grocery dungeon crawler
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  const container = document.getElementById('game-container');
  const size = Math.min(window.innerWidth, window.innerHeight, 540);
  canvas.width = 540;
  canvas.height = 540;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  container.style.width = size + 'px';
  container.style.height = size + 'px';
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// TILE MAP
// ============================================================
const TILE = 30;
const COLS = 18;
const ROWS = 18;

const ZONE_COLORS = [
  { rows: [0,3],   floor: '#1a2a1a', label: 'PRODUCE',    color: '#4CAF50' },
  { rows: [3,7],   floor: '#2a1a1a', label: 'DELI',       color: '#D4A017' },
  { rows: [7,11],  floor: '#1a1a2a', label: 'FREEZER',    color: '#4fc3f7' },
  { rows: [11,15], floor: '#2a1a10', label: 'DRY GOODS',  color: '#8B6914' },
  { rows: [15,18], floor: '#1a1020', label: 'BACK ROOM',  color: '#7c3aed' },
];

function getZoneFloor(row) {
  for (const z of ZONE_COLORS) {
    if (row >= z.rows[0] && row < z.rows[1]) return z;
  }
  return { floor: '#111', color: '#555', label: '' };
}

const RAW_MAP = [
  "111111111111111111",
  "1E0000010000100001",
  "100200010200100001",
  "111010111010101111",
  "100000000H00000001",
  "102010302010301001",
  "100010000010000B01",
  "111111010111010111",
  "100000000000H00001",
  "102000302000300201",
  "100000B00000000001",
  "111010111010101111",
  "100000000000H00001",
  "100200020020200001",
  "100010000010000001",
  "111100000000001111",
  "10000K000000K00001",
  "111100000T000001111",
];

(function fixMapPositions() {
  function setChar(rowStr, col, ch) {
    return rowStr.slice(0, col) + ch + rowStr.slice(col + 1);
  }
  RAW_MAP[4]  = setChar(RAW_MAP[4],  8,  'H');
  RAW_MAP[8]  = setChar(RAW_MAP[8],  4,  'H');
  RAW_MAP[12] = setChar(RAW_MAP[12], 10, 'H');
  RAW_MAP[6]  = setChar(RAW_MAP[6],  12, 'B');
  RAW_MAP[10] = setChar(RAW_MAP[10], 6,  'B');
})();

function parseMap(raw) {
  const map = [];
  for (let r = 0; r < raw.length; r++) {
    const row = [];
    for (let c = 0; c < raw[r].length; c++) row.push(raw[r][c]);
    map.push(row);
  }
  return map;
}
const MAP = parseMap(RAW_MAP);

// ============================================================
// PROMO CARD DEFINITIONS
// ============================================================
const PROMO_CARDS = [
  {
    name: 'CLEARANCE BIN SPECIAL', rarity: 'PROMO', rarityLabel: 'PROMO',
    headerColor: '#6b7280', headerText: '#fff', emoji: '🏷️📦',
    flavor: '"70% off. Still worth playing."',
    rules: ['Worth 1 point.', 'Shuffle back into deck when played.'],
    border: '#9ca3af',
  },
  {
    name: 'FLOOR SAMPLE', rarity: 'COMMON PROMO', rarityLabel: 'COMMON PROMO',
    headerColor: '#2563eb', headerText: '#fff', emoji: '🛒✨',
    flavor: '"Someone left it. You found it. No questions."',
    rules: ['Worth 2 points. Play anytime.', 'Discard 1 Chaos card from your hand.'],
    border: '#3b82f6',
  },
  {
    name: 'BACK ROOM FIND', rarity: 'UNCOMMON', rarityLabel: 'UNCOMMON',
    headerColor: '#16a34a', headerText: '#fff', emoji: '📦🌿',
    flavor: '"Found between rows 12 & 13. Kevin never knew."',
    rules: ['Double your next Stock card value.', 'Draw 2 cards.', 'Cannot be countered.'],
    border: '#22c55e',
  },
  {
    name: "KEVIN'S STASH", rarity: 'RARE', rarityLabel: 'RARE',
    headerColor: '#ea580c', headerText: '#fff', emoji: '😤💰',
    flavor: '"Kevin had a side hustle. We don\'t talk about it."',
    rules: ["Play on Kevin's turn.", 'Gain 3 Stock cards from the void.', 'Kevin misses next turn.'],
    border: '#f97316',
  },
  {
    name: 'THE PHANTOM STASH', rarity: 'ULTRA RARE', rarityLabel: 'ULTRA RARE · 1 OF 1',
    headerColor: '#b45309', headerText: '#ffe066', emoji: '👻🌿',
    flavor: '"Never logged. Never taxed. Never existed."',
    rules: ['Play for free.', 'Steal 1 Stock card from each opponent.', 'Cannot be blocked.'],
    border: '#f59e0b',
  },
];

function getEarnedCardIndex() {
  if (player.hp >= 3) return 4;
  if (player.score >= 60) return 3;
  if (player.score >= 30) return 2;
  if (player.score >= 10) return 1;
  return 0;
}

// ============================================================
// PEERJS — HOST SIDE
// ============================================================
const ROOM_CHARSET = 'ABCDEFGHJKLMNPQRTVWXYZ2345679';
function genRoomCode(len = 4) {
  let code = '';
  for (let i = 0; i < len; i++) code += ROOM_CHARSET[Math.floor(Math.random() * ROOM_CHARSET.length)];
  return code;
}

const ROOM_CODE = genRoomCode();
const PEER_ID = 'kc-dungeon-' + ROOM_CODE;
let hostPeer = null;
let hecklerConnections = []; // array of active DataConnections
let hecklerCount = 0;

function initPeer() {
  hostPeer = new Peer(PEER_ID, { debug: 1 });

  hostPeer.on('open', (id) => {
    console.log('[Peer] Host open:', id);
    updateRoomCodeUI();
  });

  hostPeer.on('connection', (conn) => {
    conn.on('open', () => {
      hecklerConnections.push(conn);
      hecklerCount++;
      updateRoomCodeUI();
      showMessage('👥 Heckler joined the game!');
    });

    conn.on('data', (rawData) => {
      try {
        const msg = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
        handleHeckleMessage(msg);
      } catch(e) {
        console.warn('[Peer] Bad message', rawData);
      }
    });

    conn.on('close', () => {
      hecklerConnections = hecklerConnections.filter(c => c !== conn);
      hecklerCount = Math.max(0, hecklerCount - 1);
      updateRoomCodeUI();
    });
  });

  hostPeer.on('error', (err) => {
    console.warn('[Peer] Host error:', err.type);
    // If ID taken (from previous session), gen a new one — but we use a fixed ID per page load so just log
  });
}

function updateRoomCodeUI() {
  const joinURL = window.location.href.split('?')[0] + '?join=' + ROOM_CODE;
  const codeEl = document.getElementById('room-code-hud');
  if (codeEl) codeEl.textContent = 'ROOM: ' + ROOM_CODE;
  const countEl = document.getElementById('hecklers-count');
  if (countEl) countEl.textContent = hecklerCount > 0 ? '👥 ' + hecklerCount : '';
}

// ============================================================
// OBSTACLE TYPES — heckler-triggered
// ============================================================
let wetFloorTiles = [];  // { x, y, life }
let cartObstacles = [];  // { x, y, vx, w, h, life }

function handleHeckleMessage(msg) {
  if (gameState !== GAME_STATES.PLAYING) return;
  const name = (msg.name || 'Heckler').slice(0, 16);

  switch (msg.type) {
    case 'wet_floor':
      spawnWetFloor(name);
      break;
    case 'cart':
      spawnCart(name);
      break;
    case 'mini_kevin':
      spawnMiniKevin(name);
      break;
    case 'restock':
      doRestock(name);
      break;
  }
}

function spawnWetFloor(name) {
  // Pick a random open floor tile near player
  const camX = Math.max(0, Math.min(player.x - canvas.width/2,  COLS*TILE - canvas.width));
  const camY = Math.max(0, Math.min(player.y - canvas.height/2, ROWS*TILE - canvas.height));
  const candidates = [];
  for (let r = 1; r < ROWS - 1; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      const ch = MAP[r][c];
      if (ch !== '1' && ch !== 'T') {
        const wx = c * TILE + TILE/2, wy = r * TILE + TILE/2;
        // Must be on screen
        if (wx >= camX && wx <= camX + canvas.width && wy >= camY && wy <= camY + canvas.height) {
          candidates.push({ x: wx, y: wy });
        }
      }
    }
  }
  if (candidates.length === 0) return;
  const spot = candidates[Math.floor(Math.random() * candidates.length)];
  wetFloorTiles.push({ x: spot.x, y: spot.y, life: 600 }); // lasts 10 seconds
  showMessage(name + ' threw a wet floor!');
}

function spawnCart(name) {
  // Slides horizontally at player's Y, entering from the left or right edge
  const fromLeft = Math.random() < 0.5;
  const startX = fromLeft ? -30 : canvas.width + COLS*TILE;
  // Use player row, clamped to a valid row
  const row = Math.max(1, Math.min(ROWS - 2, Math.floor(player.y / TILE)));
  const cartY = row * TILE + TILE / 2;
  const speed = fromLeft ? 4 : -4;
  cartObstacles.push({
    x: player.x + (fromLeft ? -canvas.width/2 - 30 : canvas.width/2 + 30),
    y: cartY,
    vx: speed,
    w: 36, h: 24,
    life: 300,
    hit: false,
  });
  showMessage(name + ' threw a shopping cart!');
}

function spawnMiniKevin(name) {
  // Spawn at a random edge of the visible screen
  const camX = Math.max(0, Math.min(player.x - canvas.width/2,  COLS*TILE - canvas.width));
  const camY = Math.max(0, Math.min(player.y - canvas.height/2, ROWS*TILE - canvas.height));
  const edge = Math.floor(Math.random() * 4);
  let ex, ey;
  if (edge === 0) { ex = camX + Math.random() * canvas.width; ey = camY + 5; }
  else if (edge === 1) { ex = camX + Math.random() * canvas.width; ey = camY + canvas.height - 5; }
  else if (edge === 2) { ex = camX + 5; ey = camY + Math.random() * canvas.height; }
  else { ex = camX + canvas.width - 5; ey = camY + Math.random() * canvas.height; }

  const miniKevinDef = {
    color: '#ff7a00',
    size: 14,
    speed: 1.8,
    hp: 1,
    name: 'MINI KEVIN',
    patrol: false,
    damage: 1,
    isMiniKevin: true,
  };
  enemies.push({
    x: ex, y: ey,
    startX: ex, startY: ey,
    vx: 0, vy: 0,
    hp: 1, maxHp: 1,
    def: miniKevinDef,
    invincible: 0,
    dead: false,
    animFrame: 0,
    animTimer: 0,
    isMiniKevin: true,
  });
  showMessage(name + ' unleashed a Mini Kevin!');
}

function doRestock(name) {
  // Respawn all collected pickups
  for (const p of pickups) {
    p.collected = false;
  }
  showMessage(name + ' restocked the store! 📦');
}

// ============================================================
// GAME STATE
// ============================================================
const GAME_STATES = { TITLE: 'title', PLAYING: 'playing', DEAD: 'dead', WIN: 'win', BOSS_INTRO: 'boss_intro' };
let gameState = GAME_STATES.TITLE;
let stateTimer = 0;
let cardRevealed = false;
let cardFlipAngle = 0;
let cardFlipping = false;
let earnedCardIndex = 0;

const player = {
  x: 1 * TILE + TILE/2,
  y: 1 * TILE + TILE/2,
  w: 22, h: 22,
  speed: 3,
  hp: 3,
  maxHp: 3,
  heldItem: null,
  invincible: 0,
  facing: 'down',
  animFrame: 0,
  animTimer: 0,
  score: 0,
  speedBoost: 0,
  stunned: 0,  // frames stunned (wet floor)
};

const ITEM_TYPES = [
  { name: 'Flower Jar',  color: '#7c3aed', emoji: '🌸', damage: 2 },
  { name: 'Pre-Roll',   color: '#16a34a', emoji: '🚬', damage: 1 },
  { name: 'Edible',     color: '#f97316', emoji: '🍫', damage: 1 },
  { name: 'Vape Cart',  color: '#0ea5e9', emoji: '💨', damage: 1 },
];

let pickups = [];
let healthPacks = [];
let speedBoosts = [];
let projectiles = [];
let enemies = [];
let particles = [];
let bossIntroShown = false;
let kevinAlive = true;
let kevinHp = 5;
let doorOpen = false;
let gameMessage = '';
let gameMessageTimer = 0;

const ENEMY_DEFS = {
  chaos: { color: '#ef4444', size: 20, speed: 0.7, hp: 1, name: 'CHAOS', patrol: true, damage: 1 },
  inspector: { color: '#a855f7', size: 20, speed: 1.2, hp: 1, name: 'INSPECTOR', patrol: false, damage: 1 },
  kevin: { color: '#ff7a00', size: 28, speed: 1.0, hp: 5, name: 'KEVIN', patrol: false, damage: 2, isBoss: true },
};

// ============================================================
// INIT
// ============================================================
function initGame() {
  player.x = 1.5 * TILE;
  player.y = 1.5 * TILE;
  player.hp = 3;
  player.heldItem = null;
  player.invincible = 0;
  player.score = 0;
  player.speedBoost = 0;
  player.speed = 3;
  player.stunned = 0;
  pickups = [];
  healthPacks = [];
  speedBoosts = [];
  projectiles = [];
  enemies = [];
  particles = [];
  wetFloorTiles = [];
  cartObstacles = [];
  bossIntroShown = false;
  kevinAlive = true;
  kevinHp = 5;
  doorOpen = false;
  cardRevealed = false;
  cardFlipping = false;
  cardFlipAngle = 0;
  earnedCardIndex = 0;
  gameMessage = '';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAP[r][c] === '2') {
        const type = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
        pickups.push({ x: c * TILE + TILE/2, y: r * TILE + TILE/2, type, collected: false });
      }
      if (MAP[r][c] === 'H') {
        healthPacks.push({ x: c * TILE + TILE/2, y: r * TILE + TILE/2, collected: false });
      }
      if (MAP[r][c] === 'B') {
        speedBoosts.push({ x: c * TILE + TILE/2, y: r * TILE + TILE/2, collected: false });
      }
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = MAP[r][c];
      if (ch === '3') {
        const def = (r < 7) ? ENEMY_DEFS.chaos : ENEMY_DEFS.inspector;
        enemies.push({
          x: c * TILE + TILE/2, y: r * TILE + TILE/2,
          startX: c * TILE + TILE/2, startY: r * TILE + TILE/2,
          vx: def.patrol ? def.speed : 0, vy: 0,
          hp: def.hp, maxHp: def.hp, def,
          patrolDist: TILE * 2.5, patrolDir: 1, patrolMoved: 0,
          invincible: 0, dead: false, animFrame: 0, animTimer: 0,
        });
      }
      if (ch === 'K') {
        enemies.push({
          x: c * TILE + TILE/2, y: r * TILE + TILE/2,
          startX: c * TILE + TILE/2, startY: r * TILE + TILE/2,
          vx: 0, vy: 0, hp: 5, maxHp: 5,
          def: ENEMY_DEFS.kevin, invincible: 0, dead: false,
          animFrame: 0, animTimer: 0, isBoss: true,
        });
      }
    }
  }

  updateHUD();
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'KeyZ') && gameState === GAME_STATES.PLAYING) throwItem();
  if (e.code === 'Enter' || e.code === 'Space') {
    if (gameState === GAME_STATES.TITLE) { gameState = GAME_STATES.PLAYING; initGame(); }
    if (gameState === GAME_STATES.DEAD) { gameState = GAME_STATES.PLAYING; initGame(); }
    if (gameState === GAME_STATES.WIN && cardRevealed) { gameState = GAME_STATES.TITLE; }
    if (gameState === GAME_STATES.WIN && !cardFlipping) { cardFlipping = true; }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const dpadState = { up: false, down: false, left: false, right: false };
function bindDpad(id, dir) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); dpadState[dir] = true; }, { passive: false });
  btn.addEventListener('touchend',   e => { e.preventDefault(); dpadState[dir] = false; }, { passive: false });
  btn.addEventListener('mousedown',  () => dpadState[dir] = true);
  btn.addEventListener('mouseup',    () => dpadState[dir] = false);
}
bindDpad('btn-up', 'up');
bindDpad('btn-down', 'down');
bindDpad('btn-left', 'left');
bindDpad('btn-right', 'right');

document.getElementById('throw-btn').addEventListener('click', () => {
  if (gameState === GAME_STATES.PLAYING) throwItem();
  if (gameState === GAME_STATES.WIN && !cardFlipping && !cardRevealed) { cardFlipping = true; }
  if (gameState === GAME_STATES.WIN && cardRevealed) { gameState = GAME_STATES.TITLE; }
  if (gameState === GAME_STATES.TITLE) { gameState = GAME_STATES.PLAYING; initGame(); }
  if (gameState === GAME_STATES.DEAD) { gameState = GAME_STATES.PLAYING; initGame(); }
});

// ============================================================
// COLLISION HELPERS
// ============================================================
function tileAt(px, py) {
  const c = Math.floor(px / TILE);
  const r = Math.floor(py / TILE);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return '1';
  return MAP[r][c];
}

function isWall(px, py) {
  const ch = tileAt(px, py);
  if (ch === '1') return true;
  if (ch === 'H' || ch === 'B') return false;
  if (!doorOpen && Math.floor(py / TILE) === 17) return true;
  return false;
}

function canMove(nx, ny, w, h) {
  const half = Math.floor(w / 2) - 2;
  return !isWall(nx - half, ny - half) &&
         !isWall(nx + half, ny - half) &&
         !isWall(nx - half, ny + half) &&
         !isWall(nx + half, ny + half);
}

// ============================================================
// PLAYER ACTIONS
// ============================================================
function throwItem() {
  if (!player.heldItem) return;
  let vx = 0, vy = 0;
  if (player.facing === 'up')    vy = -6;
  if (player.facing === 'down')  vy =  6;
  if (player.facing === 'left')  vx = -6;
  if (player.facing === 'right') vx =  6;
  projectiles.push({
    x: player.x, y: player.y, vx, vy,
    damage: player.heldItem.damage,
    color: player.heldItem.color,
    emoji: player.heldItem.emoji,
    life: 80, owner: 'player',
  });
  player.heldItem = null;
  updateHUD();
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (gameState === GAME_STATES.TITLE || gameState === GAME_STATES.DEAD) return;

  if (gameState === GAME_STATES.WIN) {
    if (cardFlipping && cardFlipAngle < Math.PI) {
      cardFlipAngle += 0.06;
      if (cardFlipAngle >= Math.PI) { cardFlipAngle = Math.PI; cardRevealed = true; cardFlipping = false; }
    }
    return;
  }

  stateTimer++;

  // Speed boost tick-down
  if (player.speedBoost > 0) {
    player.speedBoost--;
    player.speed = 5;
    if (player.speedBoost === 0) player.speed = 3;
  }

  // Stun tick-down
  if (player.stunned > 0) player.stunned--;

  // ---- Player movement ----
  let dx = 0, dy = 0;
  if (player.stunned === 0) {
    if (keys['ArrowUp']    || keys['KeyW'] || dpadState.up)    dy = -player.speed;
    if (keys['ArrowDown']  || keys['KeyS'] || dpadState.down)  dy =  player.speed;
    if (keys['ArrowLeft']  || keys['KeyA'] || dpadState.left)  dx = -player.speed;
    if (keys['ArrowRight'] || keys['KeyD'] || dpadState.right) dx =  player.speed;
  }

  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

  if (dx !== 0 || dy !== 0) {
    player.animTimer++;
    if (player.animTimer > 8) { player.animFrame = (player.animFrame + 1) % 2; player.animTimer = 0; }
    if (Math.abs(dx) > Math.abs(dy)) player.facing = dx > 0 ? 'right' : 'left';
    else player.facing = dy > 0 ? 'down' : 'up';
  }

  const nx = player.x + dx;
  const ny = player.y + dy;
  if (canMove(nx, player.y, player.w, player.h)) player.x = nx;
  if (canMove(player.x, ny, player.w, player.h)) player.y = ny;

  player.x = Math.max(TILE + player.w/2, Math.min(player.x, (COLS-1)*TILE - player.w/2));
  player.y = Math.max(TILE + player.h/2, Math.min(player.y, (ROWS-1)*TILE - player.h/2));

  if (player.invincible > 0) player.invincible--;

  // ---- Wet floor check ----
  for (let i = wetFloorTiles.length - 1; i >= 0; i--) {
    const wf = wetFloorTiles[i];
    wf.life--;
    if (wf.life <= 0) { wetFloorTiles.splice(i, 1); continue; }
    if (player.stunned === 0 && Math.hypot(player.x - wf.x, player.y - wf.y) < TILE * 0.7) {
      player.stunned = 60;
      showMessage('💦 Slipped on wet floor!');
    }
  }

  // ---- Cart obstacle check ----
  for (let i = cartObstacles.length - 1; i >= 0; i--) {
    const cart = cartObstacles[i];
    cart.x += cart.vx;
    cart.life--;
    if (cart.life <= 0 || isWall(cart.x, cart.y)) {
      cartObstacles.splice(i, 1);
      continue;
    }
    // Hit player
    if (!cart.hit && player.invincible === 0) {
      if (Math.abs(cart.x - player.x) < (cart.w + player.w) / 2 &&
          Math.abs(cart.y - player.y) < (cart.h + player.h) / 2) {
        cart.hit = true;
        player.hp -= 1;
        player.invincible = 90;
        spawnParticles(player.x, player.y, '#9ca3af', 8);
        updateHUD();
        if (player.hp <= 0) { gameState = GAME_STATES.DEAD; return; }
      }
    }
  }

  // ---- Pickup collection ----
  for (const p of pickups) {
    if (p.collected) continue;
    if (Math.hypot(p.x - player.x, p.y - player.y) < TILE * 0.8 && !player.heldItem) {
      player.heldItem = p.type;
      p.collected = true;
      showMessage('Got ' + p.type.emoji + ' ' + p.type.name + '!');
      updateHUD();
    }
  }

  // ---- Health pack collection ----
  for (const h of healthPacks) {
    if (h.collected) continue;
    if (Math.hypot(h.x - player.x, h.y - player.y) < TILE * 0.8) {
      h.collected = true;
      if (player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + 1);
        showMessage('❤️ Health restored!');
        updateHUD();
      } else {
        showMessage('❤️ Already at full health!');
      }
    }
  }

  // ---- Speed boost collection ----
  for (const b of speedBoosts) {
    if (b.collected) continue;
    if (Math.hypot(b.x - player.x, b.y - player.y) < TILE * 0.8) {
      b.collected = true;
      player.speedBoost = 120;
      player.speed = 5;
      showMessage('⚡ Speed boost!');
    }
  }

  // ---- Treasure check ----
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAP[r][c] === 'T') {
        const tx = c * TILE + TILE/2, ty = r * TILE + TILE/2;
        if (Math.hypot(player.x - tx, player.y - ty) < TILE * 1.0 && doorOpen) {
          earnedCardIndex = getEarnedCardIndex();
          gameState = GAME_STATES.WIN;
        }
      }
    }
  }

  // ---- Enemy update ----
  for (const e of enemies) {
    if (e.dead) continue;
    e.animTimer++;
    if (e.animTimer > 12) { e.animFrame = (e.animFrame + 1) % 2; e.animTimer = 0; }
    if (e.invincible > 0) e.invincible--;

    if (e.def.patrol && !e.isBoss && !e.isMiniKevin) {
      e.patrolMoved += e.def.speed;
      e.x += e.def.speed * e.patrolDir;
      if (e.patrolMoved >= e.patrolDist || isWall(e.x + e.def.size/2 * e.patrolDir, e.y)) {
        e.patrolDir *= -1;
        e.patrolMoved = 0;
      }
    } else {
      const dist = Math.hypot(player.x - e.x, player.y - e.y);
      const aggroRange = e.isBoss ? 999 : (e.isMiniKevin ? 999 : TILE * 5);
      if (dist < aggroRange && dist > 2) {
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        const spd = e.isBoss ? (kevinHp <= 2 ? e.def.speed * 1.6 : e.def.speed) : e.def.speed;
        const ex = e.x + Math.cos(ang) * spd;
        const ey = e.y + Math.sin(ang) * spd;
        if (canMove(ex, e.y, e.def.size, e.def.size)) e.x = ex;
        if (canMove(e.x, ey, e.def.size, e.def.size)) e.y = ey;
      }
    }

    if (player.invincible === 0) {
      const dist = Math.hypot(player.x - e.x, player.y - e.y);
      if (dist < (e.def.size + player.w) / 2 - 2) {
        player.hp -= e.def.damage;
        player.invincible = 90;
        spawnParticles(player.x, player.y, '#ef4444', 8);
        updateHUD();
        if (player.hp <= 0) { gameState = GAME_STATES.DEAD; return; }
      }
    }
  }

  // ---- Projectile update ----
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if (isWall(p.x, p.y) || p.life <= 0) {
      spawnParticles(p.x, p.y, p.color, 5);
      projectiles.splice(i, 1);
      continue;
    }

    for (const e of enemies) {
      if (e.dead || e.invincible > 0) continue;
      if (Math.hypot(p.x - e.x, p.y - e.y) < e.def.size / 2 + 6) {
        e.hp -= p.damage;
        e.invincible = 30;
        spawnParticles(e.x, e.y, p.color, 6);
        projectiles.splice(i, 1);
        if (e.hp <= 0) {
          e.dead = true;
          spawnParticles(e.x, e.y, '#ffe066', 12);
          player.score += (e.isBoss ? 50 : (e.isMiniKevin ? 5 : 10));
          if (e.isBoss) {
            kevinAlive = false;
            doorOpen = true;
            showMessage('🎉 KEVIN IS DOWN! GRAB THE TREASURE!');
          }
        }
        break;
      }
    }
  }

  // ---- Particles ----
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;
    p.vy += 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (gameMessageTimer > 0) gameMessageTimer--;
}

// ============================================================
// HELPERS
// ============================================================
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, life: 20 + Math.random()*15, color });
  }
}

function showMessage(msg) {
  gameMessage = msg;
  gameMessageTimer = 120;
}

function updateHUD() {
  document.getElementById('hp-display').textContent = '♥'.repeat(Math.max(0,player.hp)) + '♡'.repeat(Math.max(0,player.maxHp - player.hp));
  document.getElementById('item-display').textContent = player.heldItem ? player.heldItem.emoji + ' ' + player.heldItem.name : '—';
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === GAME_STATES.TITLE) { drawTitle(); return; }
  if (gameState === GAME_STATES.DEAD)  { drawDead(); return; }
  if (gameState === GAME_STATES.WIN)   { drawWin(); return; }

  const camX = Math.max(0, Math.min(player.x - canvas.width/2,  COLS*TILE - canvas.width));
  const camY = Math.max(0, Math.min(player.y - canvas.height/2, ROWS*TILE - canvas.height));

  ctx.save();
  ctx.translate(-camX, -camY);

  // ---- Draw tiles ----
  for (let r = 0; r < ROWS; r++) {
    const zone = getZoneFloor(r);
    for (let c = 0; c < COLS; c++) {
      const ch = MAP[r][c];
      const tx = c * TILE, ty = r * TILE;

      if (ch === '1') {
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(tx, ty, TILE, TILE);
        ctx.fillStyle = zone.color + '55';
        ctx.fillRect(tx+2, ty+2, TILE-4, TILE-4);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, ty, TILE, TILE);
      } else if (ch === 'T') {
        ctx.fillStyle = '#1a1020';
        ctx.fillRect(tx, ty, TILE, TILE);
        if (doorOpen) {
          ctx.font = '22px serif';
          ctx.textAlign = 'center';
          ctx.fillText('📦', tx + TILE/2, ty + TILE/2 + 8);
        }
      } else if (ch === 'H') {
        ctx.fillStyle = zone.floor;
        ctx.fillRect(tx, ty, TILE, TILE);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(tx, ty, TILE, TILE);
        const hpack = healthPacks.find(h => Math.round(h.x) === tx + TILE/2 && Math.round(h.y) === ty + TILE/2);
        if (!hpack || !hpack.collected) {
          const pulse = 0.8 + Math.sin(stateTimer * 0.1) * 0.2;
          ctx.save();
          ctx.translate(tx + TILE/2, ty + TILE/2);
          ctx.scale(pulse, pulse);
          ctx.fillStyle = 'rgba(220,38,38,0.85)';
          ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(-6, -2, 12, 4);
          ctx.fillRect(-2, -6, 4, 12);
          ctx.restore();
        }
      } else if (ch === 'B') {
        ctx.fillStyle = zone.floor;
        ctx.fillRect(tx, ty, TILE, TILE);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(tx, ty, TILE, TILE);
        const bpack = speedBoosts.find(b => Math.round(b.x) === tx + TILE/2 && Math.round(b.y) === ty + TILE/2);
        if (!bpack || !bpack.collected) {
          const pulse = 0.85 + Math.sin(stateTimer * 0.12) * 0.15;
          ctx.save();
          ctx.translate(tx + TILE/2, ty + TILE/2);
          ctx.scale(pulse, pulse);
          ctx.fillStyle = 'rgba(234,179,8,0.9)';
          ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
          ctx.font = '13px serif';
          ctx.textAlign = 'center';
          ctx.fillText('⚡', 0, 5);
          ctx.restore();
        }
      } else {
        ctx.fillStyle = zone.floor;
        ctx.fillRect(tx, ty, TILE, TILE);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(tx, ty, TILE, TILE);
        if (c === 1 && r === zone.rows[0] && zone.label) {
          ctx.fillStyle = zone.color + 'aa';
          ctx.font = 'bold 9px Courier New';
          ctx.textAlign = 'left';
          ctx.fillText(zone.label, tx + 2, ty + 11);
        }
      }

      if (r === 17 && ch !== '1' && ch !== 'T' && !doorOpen) {
        ctx.fillStyle = '#444';
        ctx.fillRect(tx, ty, TILE, TILE);
        ctx.fillStyle = '#ff7a00';
        ctx.font = '9px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('BOSS', tx + TILE/2, ty + TILE/2 + 3);
      }
    }
  }

  // Zone dividers
  for (const z of ZONE_COLORS) {
    const y = z.rows[0] * TILE;
    ctx.strokeStyle = z.color + '55';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(COLS * TILE, y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ---- Wet floor tiles ----
  for (const wf of wetFloorTiles) {
    const alpha = Math.min(1, wf.life / 60) * 0.85;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(wf.x, wf.y);
    // Yellow puddle
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.ellipse(0, 0, TILE * 0.6, TILE * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.font = '16px serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️', 0, 6);
    ctx.restore();
  }

  // ---- Cart obstacles ----
  for (const cart of cartObstacles) {
    ctx.save();
    ctx.translate(cart.x, cart.y);
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(-cart.w/2, -cart.h/2, cart.w, cart.h);
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 2;
    ctx.strokeRect(-cart.w/2, -cart.h/2, cart.w, cart.h);
    // Wheels
    ctx.fillStyle = '#374151';
    ctx.fillRect(-cart.w/2 + 2, cart.h/2 - 4, 8, 4);
    ctx.fillRect(cart.w/2 - 10, cart.h/2 - 4, 8, 4);
    ctx.font = '14px serif';
    ctx.textAlign = 'center';
    ctx.fillText('🛒', 0, 6);
    ctx.restore();
  }

  // ---- Pickups ----
  for (const p of pickups) {
    if (p.collected) continue;
    const pulse = 0.85 + Math.sin(stateTimer * 0.08) * 0.15;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = p.type.color;
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.type.color;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.font = '12px serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.type.emoji, 0, 4);
    ctx.restore();
  }

  // ---- Enemies ----
  for (const e of enemies) {
    if (e.dead) continue;
    const bob = Math.sin(stateTimer * 0.1 + e.x) * 2;
    const flash = e.invincible > 0 && Math.floor(e.invincible / 5) % 2 === 0;
    if (flash) ctx.globalAlpha = 0.4;

    ctx.save();
    ctx.translate(e.x, e.y + bob);
    const s = e.def.size;

    ctx.fillStyle = e.def.color;
    ctx.fillRect(-s/2, -s/2, s, s);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-s/4-2, -s/4, 5, 5);
    ctx.fillRect( s/4-3, -s/4, 5, 5);
    ctx.fillStyle = e.animFrame === 0 ? '#000' : '#111';
    ctx.fillRect(-s/4, -s/4+1, 3, 3);
    ctx.fillRect( s/4-2, -s/4+1, 3, 3);
    ctx.fillStyle = '#000';
    if (e.isBoss) {
      ctx.fillRect(-6, s/4-2, 12, 3);
      ctx.fillRect(-8, s/4-4, 3, 3);
      ctx.fillRect( 5, s/4-4, 3, 3);
    } else {
      ctx.fillRect(-4, s/4-2, 8, 3);
    }
    if (e.isBoss) {
      const bw = 40, bh = 6;
      ctx.fillStyle = '#333';
      ctx.fillRect(-bw/2, s/2+4, bw, bh);
      ctx.fillStyle = '#ff7a00';
      ctx.fillRect(-bw/2, s/2+4, bw * (e.hp / e.maxHp), bh);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.strokeRect(-bw/2, s/2+4, bw, bh);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('KEVIN', 0, s/2+17);
    }
    // Mini kevin label
    if (e.isMiniKevin) {
      ctx.fillStyle = '#ffe066';
      ctx.font = 'bold 7px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('mini', 0, s/2+9);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---- Projectiles ----
  for (const p of projectiles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.font = '11px serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.emoji || '•', 0, 4);
    ctx.restore();
  }

  // ---- Particles ----
  for (const p of particles) {
    ctx.globalAlpha = p.life / 35;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    ctx.globalAlpha = 1;
  }

  // ---- Player ----
  const pFlash = player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0;
  if (!pFlash) {
    ctx.save();
    ctx.translate(player.x, player.y);
    const pw = player.w, ph = player.h;
    const bob = Math.sin(stateTimer * 0.15) * (1 + player.animFrame);
    ctx.translate(0, bob);

    // Stun effect
    if (player.stunned > 0) {
      ctx.globalAlpha = 0.5 + Math.sin(stateTimer * 0.5) * 0.3;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(0, 0, pw/2 + 8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (player.speedBoost > 0) {
      const auraPulse = 0.5 + Math.sin(stateTimer * 0.3) * 0.3;
      ctx.globalAlpha = auraPulse;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(0, 0, pw/2 + 6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#16a34a';
    ctx.fillRect(-pw/2+2, -ph/2+6, pw-4, ph-8);
    ctx.fillStyle = '#d4b896';
    ctx.fillRect(-pw/2+4, -ph/2, pw-8, 12);
    ctx.fillStyle = '#1a1a1a';
    if (player.facing !== 'up') {
      ctx.fillRect(-4, -ph/2+3, 3, 3);
      ctx.fillRect(1, -ph/2+3, 3, 3);
    }
    if (player.heldItem) {
      ctx.font = '14px serif';
      ctx.textAlign = 'center';
      ctx.fillText(player.heldItem.emoji, 0, -ph/2 - 6);
    }
    ctx.restore();
  }

  ctx.restore(); // end camera

  // ---- On-screen message ----
  if (gameMessageTimer > 0) {
    const alpha = Math.min(1, gameMessageTimer / 20);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, canvas.height/2 - 22, canvas.width, 36);
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(gameMessage, canvas.width/2, canvas.height/2 + 6);
    ctx.restore();
  }

  drawMiniMap();
}

function drawMiniMap() {
  const mw = 90, mh = 90;
  const mx = canvas.width - mw - 6, my = 30;
  const tw = mw / COLS, th = mh / ROWS;
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#000';
  ctx.fillRect(mx-2, my-2, mw+4, mh+4);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = MAP[r][c];
      if (ch === '1') ctx.fillStyle = '#444';
      else if (ch === 'T') ctx.fillStyle = '#ffe066';
      else if (!doorOpen && r === 17) ctx.fillStyle = '#ff7a00';
      else if (ch === 'H') ctx.fillStyle = '#ef4444';
      else if (ch === 'B') ctx.fillStyle = '#eab308';
      else ctx.fillStyle = getZoneFloor(r).floor;
      ctx.fillRect(mx + c*tw, my + r*th, tw, th);
    }
  }
  ctx.fillStyle = '#00ff88';
  const px2 = mx + (player.x / (COLS*TILE)) * mw;
  const py2 = my + (player.y / (ROWS*TILE)) * mh;
  ctx.beginPath(); ctx.arc(px2, py2, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ef4444';
  for (const e of enemies) {
    if (e.dead) continue;
    ctx.fillRect(mx + (e.x/(COLS*TILE))*mw - 1.5, my + (e.y/(ROWS*TILE))*mh - 1.5, 3, 3);
  }
  // Wet floor dots (cyan)
  ctx.fillStyle = '#fbbf24';
  for (const wf of wetFloorTiles) {
    ctx.fillRect(mx + (wf.x/(COLS*TILE))*mw - 1, my + (wf.y/(ROWS*TILE))*mh - 1, 2, 2);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ============================================================
// SCREENS
// ============================================================
function drawTitle() {
  ctx.fillStyle = '#0a0f0a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for (let y=0; y<canvas.height; y+=4) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0,y,canvas.width,2);
  }

  ctx.textAlign = 'center';
  const pulse = Math.sin(Date.now() * 0.003) * 0.5 + 0.5;
  ctx.fillStyle = `rgb(${Math.floor(255*pulse)}, 122, 0)`;
  ctx.font = 'bold 28px Courier New';
  ctx.fillText('AISLE CHAOS', canvas.width/2, 110);
  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold 16px Courier New';
  ctx.fillText('DUNGEON RUN', canvas.width/2, 134);

  ctx.fillStyle = '#16a34a';
  ctx.fillRect(canvas.width/2-60, 154, 120, 60);
  ctx.fillStyle = '#fff';
  ctx.font = '11px Courier New';
  ctx.fillText('KUSH CHAOS SHOP', canvas.width/2, 189);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(canvas.width/2-10, 168, 20, 46);
  ctx.fillStyle = '#b3e5fc';
  ctx.fillRect(canvas.width/2-50, 164, 25, 25);
  ctx.fillRect(canvas.width/2+25, 164, 25, 25);

  ctx.fillStyle = '#aaa';
  ctx.font = '12px Courier New';
  ctx.fillText('Navigate the store.', canvas.width/2, 240);
  ctx.fillText('Pick up products. Throw them.', canvas.width/2, 258);
  ctx.fillText('Beat Kevin. Get the treasure.', canvas.width/2, 276);

  ctx.fillStyle = '#16a34a';
  ctx.font = '11px Courier New';
  ctx.fillText('WASD / ARROWS / D-PAD to move', canvas.width/2, 298);
  ctx.fillText('SPACE / Z / THROW button to throw', canvas.width/2, 314);

  // Room code and join URL on title screen
  if (ROOM_CODE) {
    ctx.fillStyle = 'rgba(255,224,102,0.9)';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText('HECKLE CODE: ' + ROOM_CODE, canvas.width/2, 346);
    ctx.fillStyle = '#888';
    ctx.font = '9px Courier New';
    const joinURL = window.location.href.split('?')[0] + '?join=' + ROOM_CODE;
    ctx.fillText(joinURL, canvas.width/2, 360);
  }

  if (Math.floor(Date.now()/500) % 2 === 0) {
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 16px Courier New';
    ctx.fillText('▶  TAP TO START  ◀', canvas.width/2, 400);
  }

  ctx.fillStyle = '#555';
  ctx.font = '10px Courier New';
  ctx.fillText('A KUSH CHAOS BONUS GAME', canvas.width/2, 480);

  // Room code corner display
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '9px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('ROOM: ' + ROOM_CODE, 8, canvas.height - 8);
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 32px Courier New';
  ctx.fillText('YOU GOT FIRED', canvas.width/2, 200);
  ctx.fillStyle = '#aaa';
  ctx.font = '14px Courier New';
  ctx.fillText('Kevin called your manager.', canvas.width/2, 240);
  ctx.fillStyle = '#ffe066';
  ctx.font = '13px Courier New';
  ctx.fillText('Score: ' + player.score, canvas.width/2, 280);
  if (Math.floor(Date.now()/600) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.font = '14px Courier New';
    ctx.fillText('TAP TO TRY AGAIN', canvas.width/2, 340);
  }
}

function drawWin() {
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = '#ffe066';
  for (let i=0; i<40; i++) {
    const x = (Math.sin(i*137.5)*0.5+0.5)*canvas.width;
    const y = (Math.cos(i*97.3)*0.5+0.5)*canvas.height;
    const r2 = 1+Math.sin(Date.now()*0.003+i)*1;
    ctx.beginPath(); ctx.arc(x,y,r2,0,Math.PI*2); ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold 24px Courier New';
  ctx.fillText('YOU BEAT KEVIN!', canvas.width/2, 60);
  ctx.fillStyle = '#16a34a';
  ctx.font = '13px Courier New';
  ctx.fillText('Score: ' + player.score + (player.hp >= 3 ? '  ⭐' : ''), canvas.width/2, 80);

  const cardW = 200, cardH = 260;
  const cx2 = canvas.width/2, cy2 = canvas.height/2 + 15;

  ctx.save();
  ctx.translate(cx2, cy2);

  if (!cardRevealed) {
    const scaleX = Math.cos(cardFlipAngle);
    ctx.scale(Math.abs(scaleX) < 0.05 ? 0.05 : scaleX, 1);
    ctx.fillStyle = '#1a2e1a';
    ctx.beginPath();
    ctx.roundRect(-cardW/2, -cardH/2, cardW, cardH, 10);
    ctx.fill();
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ff7a00';
    ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('KUSH', 0, -14);
    ctx.fillText('CHAOS', 0, 8);
    ctx.fillStyle = '#ffe066';
    ctx.font = '11px Courier New';
    ctx.fillText('◆ RARE FIND ◆', 0, 40);
    if (!cardFlipping) {
      ctx.fillStyle = Math.floor(Date.now()/500) % 2 === 0 ? '#fff' : '#ffe066';
      ctx.font = '11px Courier New';
      ctx.fillText('TAP TO REVEAL', 0, cardH/2 - 20);
    }
  } else {
    drawPromoCard(0, 0, cardW, cardH, earnedCardIndex);
    ctx.fillStyle = '#fff';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('TAP TO PLAY AGAIN', 0, cardH/2 + 22);
  }
  ctx.restore();

  if (cardRevealed) {
    const card = PROMO_CARDS[earnedCardIndex];
    const heartsDisplay = '♥'.repeat(Math.max(0,player.hp)) + '♡'.repeat(Math.max(0,player.maxHp - player.hp));
    const fullHPStar = player.hp >= 3 ? ' ⭐' : '';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#aaa';
    ctx.font = '11px Courier New';
    ctx.fillText(
      'Score: ' + player.score + fullHPStar + '  |  Hearts: ' + heartsDisplay + '  |  ' + card.rarityLabel,
      canvas.width/2,
      cy2 + cardH/2 + 40
    );
  }
}

function drawPromoCard(x, y, w, h, cardIndex) {
  const card = PROMO_CARDS[cardIndex];
  ctx.fillStyle = '#FFFBEB';
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h/2, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = card.border; ctx.lineWidth = 4; ctx.stroke();

  ctx.fillStyle = card.headerColor;
  ctx.fillRect(x - w/2, y - h/2, w, 36);
  ctx.fillStyle = card.headerText;
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('✦ ' + card.rarityLabel + ' ✦', x, y - h/2 + 13);
  ctx.font = 'bold 9px Courier New';
  ctx.fillText('KUSH CHAOS PROMO CARD', x, y - h/2 + 28);

  ctx.fillStyle = '#1a2e1a';
  ctx.fillRect(x - w/2 + 10, y - h/2 + 44, w - 20, 80);
  ctx.font = '36px serif';
  ctx.textAlign = 'center';
  ctx.fillText(card.emoji, x, y - h/2 + 94);

  ctx.fillStyle = '#1E293B';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(card.name, x, y - h/2 + 142);

  ctx.strokeStyle = card.border; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - w/2 + 10, y - h/2 + 150);
  ctx.lineTo(x + w/2 - 10, y - h/2 + 150);
  ctx.stroke();

  ctx.fillStyle = '#475569';
  ctx.font = 'italic 8px Courier New';
  ctx.textAlign = 'center';
  wrapText(ctx, card.flavor, x, y - h/2 + 163, w - 24, 11);

  ctx.fillStyle = '#f8f4e8';
  ctx.fillRect(x - w/2 + 10, y - h/2 + 180, w - 20, card.rules.length * 13 + 10);
  ctx.fillStyle = '#1E293B';
  ctx.font = '8px Courier New';
  ctx.textAlign = 'center';
  card.rules.forEach((line, i) => ctx.fillText(line, x, y - h/2 + 191 + i * 13));

  const footerY = y + h/2 - 26;
  ctx.fillStyle = card.headerColor;
  ctx.fillRect(x - w/2, footerY, w, 26);
  ctx.fillStyle = card.headerText;
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('KUSH  ◆  CHAOS', x, footerY + 16);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '', lineY = y;
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
      ctx.fillText(line.trim(), x, lineY);
      line = words[i] + ' ';
      lineY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, lineY);
}

// ============================================================
// GAME LOOP
// ============================================================
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Boot
initPeer();
updateRoomCodeUI();
loop();

} // end initGamePage()
